; =============================================================================
;  FilaHygro – Firmware für ESP-12F (ESP8266)
;
;  Flashen über die serielle Stiftleiste J1 mit einem 3.3-V-USB-Seriell-Adapter.
;  Ablauf siehe docs/installation.md.
;
;    pio run                      bauen
;    pio run -t upload            flashen
;    pio device monitor           serielle Ausgabe lesen
; =============================================================================

[platformio]
default_envs = filahygro

[env]
platform = espressif8266@4.2.1
board = esp12e                   ; ESP-12E und ESP-12F sind gleich beschaltet
framework = arduino

monitor_speed = 115200
upload_speed = 460800

build_flags =
    -D FW_VERSION=\"0.1.0\"

; --- Betriebsfirmware ---
[env:filahygro]
